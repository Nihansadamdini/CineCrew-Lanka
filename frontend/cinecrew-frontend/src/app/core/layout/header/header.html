<header class="dashboard-header">

    <div class="header-title">
        <div class="header-icon">
            <svg lucideClapperboard></svg>
        </div>

        <div class="header-text">
            <h1>{{ pageTitle }}</h1>
            <p>{{ pageSubtitle}}</p>
        </div>
    </div>

    <div class="header-actions">
        <button class="header-action" aria-label="Toggle theme">
            <svg lucideSunMoon></svg>
        </button>

        <button class="header-action" aria-label="Notifications">
            <svg lucideBell></svg>
        </button>

        <button class="user-avatar" aria-label="User profile">
            T
        </button>
    </div>

</header>
