
<div class="dashboard-layout">
    <app-sidebar [isMobileMenuOpen]="isMobileMenuOpen" (closeMenu)="closeMobileMenu()""></app-sidebar>
    @if (isMobileMenuOpen) {
        <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
}

    <div class="dashboard-main">
        <app-header (menuToggle)="toggleMobileMenu()"></app-header>

        <main class="dashboard-content">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
